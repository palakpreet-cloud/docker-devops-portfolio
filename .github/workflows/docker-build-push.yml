name: Build, Push and Deploy Docker Image

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'screenshots/**'

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run API tests
        run: PYTHONPATH=. python -m pytest -v

  docker:
    needs: test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/docker-devops-portfolio-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/docker-devops-portfolio-api:${{ github.sha }}

      - name: Configure AWS credentials
        if: vars.DEPLOY_ENABLED == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to EC2 using SSM
        if: vars.DEPLOY_ENABLED == 'true'
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"sudo -u ubuntu -H git -C /home/ubuntu/docker-devops-portfolio pull --ff-only origin main\",
              \"cd /home/ubuntu/docker-devops-portfolio\",
              \"sudo env IMAGE_TAG=$IMAGE_TAG docker compose pull api\",
              \"sudo env IMAGE_TAG=$IMAGE_TAG docker compose up -d --no-build\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          echo "Deployment successful!"
